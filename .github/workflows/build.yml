name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        run: |
          ls -la
          echo "--- finding zip ---"
          find . -name "*.zip" -type f
          unzip -o *.zip || unzip -o Saktiri.zip || echo "no zip found"
          rm -f *.zip
          ls -la
          # لو فك الضغط عمل مجلد ثاني انقله لفوق
          if [ -d "Saktiri" ] && [ -f "Saktiri/gradlew" ]; then mv Saktiri/* .; rm -rf Saktiri; fi
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --info
      - uses: actions/upload-artifact@v4
        with:
          name: Saktiri-APK
          path: app/build/outputs/apk/debug/*.apk
