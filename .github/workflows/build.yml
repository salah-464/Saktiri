name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare
        run: |
          ls -la
          unzip -o Saktiri.zip
          rm -f Saktiri.zip
          # لو في مجلد ثاني جوا
          if [ -d "Saktiri" ]; then
            cp -r Saktiri/* . 2>/dev/null || true
            cp -r Saktiri/.gradle . 2>/dev/null || true
            cp -r Saktiri/.github . 2>/dev/null || true
            rm -rf Saktiri
          fi
          ls -la
          chmod +x gradlew || true
          
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        run: ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saktiri-APK
          path: app/build/outputs/apk/debug/*.apk
